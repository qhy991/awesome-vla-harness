<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="Maintenance freshness (days since last push)">

  <style>
    .bg { fill: #ffffff; }
    .label, .value, .title, .sub { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub   { font-size: 11px; fill: #6b7280; }
    .label { font-size: 12px; fill: #374151; }
    .value { font-size: 11px; fill: #6b7280; }
    .bar   { fill: #2563eb; }
    .bar-alt { fill: #7c3aed; }
    .axis  { stroke: #e5e7eb; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .title { fill: #f3f4f6; }
      .sub, .value { fill: #9ca3af; }
      .label { fill: #d1d5db; }
      .bar { fill: #60a5fa; }
      .bar-alt { fill: #a78bfa; }
      .axis { stroke: #1f2937; }
    }
  </style>

<rect class="bg" width="760" height="260" rx="8"/>
<text class="title" x="20" y="28">Maintenance freshness (days since last push)</text>
<text class="sub" x="20" y="46">maintenance / archived counted separately · fetched 2026-09-28T10:16:48Z</text>
<line class="axis" x1="210" y1="60" x2="210" y2="230"/>
<text class="label" x="200" y="85" text-anchor="end">0–30 days</text>
<rect class="bar-alt" x="210" y="74" width="460" height="16" rx="3"/>
<text class="value" x="678" y="87">6</text>
<text class="label" x="200" y="115" text-anchor="end">31–90 days</text>
<rect class="bar-alt" x="210" y="104" width="2" height="16" rx="3"/>
<text class="value" x="220" y="117">0</text>
<text class="label" x="200" y="145" text-anchor="end">91–365 days</text>
<rect class="bar-alt" x="210" y="134" width="76" height="16" rx="3"/>
<text class="value" x="294" y="147">1</text>
<text class="label" x="200" y="175" text-anchor="end">&gt;365 days</text>
<rect class="bar-alt" x="210" y="164" width="76" height="16" rx="3"/>
<text class="value" x="294" y="177">1</text>
<text class="label" x="200" y="205" text-anchor="end">maintenance / archived</text>
<rect class="bar-alt" x="210" y="194" width="76" height="16" rx="3"/>
<text class="value" x="294" y="207">1</text>
<text class="value" x="210" y="248">4 project(s) without snapshot data</text>
</svg>
