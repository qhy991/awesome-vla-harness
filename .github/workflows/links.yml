name: Links

on:
  pull_request:
  schedule:
    # 每周一 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check links (PR — changed lines only)
        if: github.event_name == 'pull_request'
        run: python scripts/check_links.py --changed-only

      - name: Check links (full sweep)
        if: github.event_name != 'pull_request'
        run: python scripts/check_links.py
