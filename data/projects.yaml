- id: rethinking-harness-evolution
  name: Rethinking the Evaluation of Harness Evolution for Agents
  organization: research
  url: https://arxiv.org/abs/2607.12227
  paper: https://arxiv.org/abs/2607.12227

  category:
    - research
    - harness-evolution

  license:
    code: unknown

  description_zh: >-
    系统质疑 harness evolution 的评测方式：在同一 benchmark 上搜索与报告、
    或投入更多推理预算都可能产生虚假增益；在匹配 feedback / inference budget
    并引入 held-out task 后，自动 harness evolution 并不总能超过简单 test-time scaling。

  capabilities:
    model_adapter: false
    benchmark_adapter: false
    scheduler: false
    parallel_rollout: false
    sandbox: false
    observability: false
    plugin_system: none

  backends:
    - research

  deployment:
    - research

  evaluation:
    - held-out-task
    - budget-matched-comparison
    - overfitting-analysis

  maturity: emerging
  last_verified: 2026-09-14

  tags:
    - harness-evaluation

  references:
    - https://arxiv.org/abs/2607.12227

