- id: vla-evaluation-harness
  name: vla-evaluation-harness
  organization: allenai
  url: https://github.com/allenai/vla-evaluation-harness
  docs: https://allenai.github.io/vla-evaluation-harness/
  paper: https://arxiv.org/abs/2603.13966

  category:
    - vla-evaluation

  license:
    code: Apache-2.0

  description_zh: >-
    跨 VLA 模型与机器人仿真 Benchmark 的统一评测 Harness；模型服务与 Benchmark
    进程通过 WebSocket + msgpack 解耦，Benchmark 依赖以容器隔离，支持并行 Episode 评测。

  capabilities:
    model_adapter: true
    benchmark_adapter: true
    scheduler: true
    parallel_rollout: true
    sandbox: true
    observability: true
    plugin_system: adapter-based

  backends:
    - vla-model-server
    - websocket

  deployment:
    - local
    - gpu
    - docker

  evaluation:
    - episode-rollout
    - success-rate
    - reproducibility
    - batch-inference

  maturity: emerging
  last_verified: 2026-09-14

  notes: >-
    模型只需实现统一的 predict()，benchmark 实现精简 adapter 接口，
    组合关系由配置文件描述。仓库中的 model/benchmark 集成数量会持续变化，
    建议从上游 config 动态读取而非硬编码。

  references:
    - https://github.com/allenai/vla-evaluation-harness
    - https://arxiv.org/abs/2603.13966

  github_snapshot:
    fetched_at: "2026-09-28T10:16:48Z"
    stars: 629
    forks: 53
    last_push: "2026-09-19T06:04:10Z"
    open_items: 4
    archived: false

